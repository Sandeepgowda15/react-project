version: 0.2

phases:

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 089783390772.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Building Docker image...
      - docker build -t react-project .
      - docker tag react-project:latest 089783390772.dkr.ecr.us-east-1.amazonaws.com/react-project:latest

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push 089783390772.dkr.ecr.us-east-1.amazonaws.com/react-project:latest
      - echo Build completed successfully!
